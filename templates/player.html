<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>视频播放器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #000; }
        .player-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; padding: 10px; z-index: 100; display: flex; align-items: center; }
        .back-btn { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 4px; margin-right: 15px; cursor: pointer; }
        .video-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #video-player { width: 100%; height: 100vh; object-fit: contain; background: black; }
    </style>
</head>
<body>
    <div class="player-header">
        <button class="back-btn" onclick="window.location.href='{{ back_url }}'">← 返回</button>
        <div class="video-title">{{ video_name }}</div>
    </div>
    <video id="video-player" controls autoplay>
        <source src="{{ video_url }}" type="video/mp4">
        您的浏览器不支持HTML5视频
    </video>

    <script>
        // 自动全屏播放
        document.getElementById('video-player').addEventListener('loadedmetadata', function() {
            this.play().catch(e => console.log('自动播放被阻止:', e));
        });
    </script>
</body>
</html>
