<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>局域网文件浏览器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .header { position: sticky; top: 0; background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        .path-bar { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .search-box { display: flex; margin-bottom: 10px; }
        .search-box input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .search-box button { padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        .file-list { list-style: none; padding: 0; margin: 0; background: white; }
        .file-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
        .file-item:hover { background: #f9f9f9; }
        .file-icon { margin-right: 12px; font-size: 20px; }
        .folder-icon { color: #4285F4; }
        .video-icon { color: #EA4335; }
        .image-icon { color: #34A853; }
        .other-icon { color: #9E9E9E; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: 12px; color: #666; display: flex; justify-content: space-between; margin-top: 2px; }
        .thumbnail { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #eee; }
        #video-player { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: black; z-index: 200; display: none; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .sort-options { display: flex; gap: 5px; margin-top: 5px; }
        .sort-btn { padding: 4px 8px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .sort-btn.active { background: #4285F4; color: white; border-color: #4285F4; }
    </style>
</head>
<body>
    <div class="header">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索文件...">
            <button onclick="performSearch()">搜索</button>
        </div>
        <div class="path-bar" id="path-bar">
            <div id="current-path">/</div>
            <div class="sort-options">
                <button class="sort-btn" data-sort="name">名称</button>
                <button class="sort-btn active" data-sort="type">类型</button>
                <button class="sort-btn" data-sort="date">日期</button>
            </div>
        </div>
    </div>

    <ul class="file-list" id="file-list"></ul>
    <div class="loading" id="loading">加载中...</div>

    <video id="video-player" controls></video>

    <script>
        const API_BASE_URL = `${window.location.protocol}//${window.location.hostname}:${window.location.port || 5000}`;
        let currentPath = "";
        let currentSort = "type";
        let currentOrder = "asc";

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('file-list').innerHTML = '';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function loadFiles(path = "") {
            showLoading();
            currentPath = path;
            document.getElementById('current-path').textContent = path || "/";

            fetch(`${API_BASE_URL}/files/${path}?sort=${currentSort}&order=${currentOrder}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('file-list');
                    list.innerHTML = '';

                    // 添加返回按钮（如果有上级目录）
                    if (data.parent !== null) {
                        const backItem = document.createElement('li');
                        backItem.className = 'file-item';
                        backItem.innerHTML = `
                            <span class="file-icon folder-icon">←</span>
                            <div class="file-info">
                                <div class="file-name">返回上级</div>
                            </div>
                        `;
                        backItem.onclick = () => loadFiles(data.parent);
                        list.appendChild(backItem);
                    }

                    // 添加文件和文件夹
                    data.items.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'file-item';

                        let icon = '📄';
                        let iconClass = 'other-icon';
                        if (item.is_dir) {
                            icon = '📁';
                            iconClass = 'folder-icon';
                        } else if (item.is_video) {
                            icon = '🎬';
                            iconClass = 'video-icon';
                        } else if (item.is_image) {
                            icon = '🖼️';
                            iconClass = 'image-icon';
                        }

                        let thumbnail = '';
                        if (item.has_thumbnail) {
                            thumbnail = `<img src="${API_BASE_URL}${item.thumbnail}" class="thumbnail" onerror="this.style.display='none'">`;
                        } else if (item.is_video || item.is_image) {
                            thumbnail = '<div class="thumbnail"></div>';
                        }

                        li.innerHTML = `
                            ${thumbnail}
                            <span class="file-icon ${iconClass}">${icon}</span>
                            <div class="file-info">
                                <div class="file-name">${item.name}</div>
                                <div class="file-meta">
                                    <span>${item.date}</span>
                                    <span>${item.is_dir ? '' : formatFileSize(item.size)}</span>
                                </div>
                            </div>
                        `;

                        li.onclick = (e) => {
                            if (e.target.tagName === 'IMG' || e.target.tagName === 'SPAN') return;

                            if (item.is_dir) {
                                loadFiles(item.path);
                            } else if (item.is_video) {
                                const player = document.getElementById('video-player');
                                player.style.display = 'block';
                                player.src = `${API_BASE_URL}/stream/${item.path}`;
                                player.play();
                            } else if (item.is_image) {
                                window.open(`${API_BASE_URL}/stream/${item.path}`, '_blank');
                            }
                        };

                        list.appendChild(li);
                    });

                    hideLoading();
                })
                .catch(error => {
                    console.error('Error:', error);
                    hideLoading();
                });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            alert('搜索功能暂未实现');
        }

        // 初始化排序按钮
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const sort = this.dataset.sort;
                if (currentSort === sort) {
                    currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort = sort;
                    currentOrder = sort === 'date' ? 'desc' : 'asc';
                }

                loadFiles(currentPath);
            });
        });

        // 初始化加载根目录
        loadFiles();
    </script>
</body>
</html>
