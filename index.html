<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>局域网文件浏览器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .header { position: sticky; top: 0; background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        .path-nav { position: sticky; top: 60px; background: white; padding: 10px; border-bottom: 1px solid #eee; z-index: 90; }
        .search-box { display: flex; margin-bottom: 10px; }
        .search-box input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .search-box button { padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        .file-list { list-style: none; padding: 0; margin: 0; background: white; }
        .file-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
        .file-item:hover { background: #f9f9f9; }
        .file-icon { margin-right: 12px; font-size: 20px; flex-shrink: 0; }
        .folder-icon { color: #4285F4; }
        .video-icon { color: #EA4335; }
        .image-icon { color: #34A853; }
        .other-icon { color: #9E9E9E; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: 12px; color: #666; display: flex; justify-content: space-between; margin-top: 2px; }
        .thumbnail { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #eee; flex-shrink: 0; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .sort-options { display: flex; gap: 5px; margin-top: 5px; }
        .sort-btn { padding: 4px 8px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .sort-btn.active { background: #4285F4; color: white; border-color: #4285F4; }
        .back-btn { background: #f0f0f0; padding: 8px 12px; border-radius: 4px; margin-right: 10px; cursor: pointer; }
        #video-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: black; z-index: 1000; display: none; }
        #video-player { width: 100%; height: 100%; object-fit: contain; }
        .player-header { position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; padding: 10px; z-index: 1001; display: flex; align-items: center; }
        .close-btn { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 4px; margin-right: 15px; cursor: pointer; }
        .player-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .search-result-item:hover {
            background: #f9f9f9;
        }

        .search-result-path {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 新增视图切换按钮 */
        .view-toggle {
            display: flex;
            margin-left: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .view-btn {
            padding: 6px 12px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .view-btn.active {
            background: #4285F4;
            color: white;
        }

        /* 平铺视图样式 */
        .file-list.grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .file-list.grid-view .file-item {
            flex-direction: column;
            align-items: center;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.2s;
        }
        .file-list.grid-view .file-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .file-list.grid-view .thumbnail {
            width: 100px;
            height: 80px;
            margin-right: 0;
            margin-bottom: 10px;
            border-radius: 4px;
            object-fit: cover;
        }
        .file-list.grid-view .file-icon {
            font-size: 40px;
            margin-right: 0;
            margin-bottom: 10px;
        }
        .file-list.grid-view .file-info {
            width: 100%;
            text-align: center;
        }
        .file-list.grid-view .file-name {
            white-space: normal;
            text-align: center;
            font-size: 14px;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-list.grid-view .file-meta {
            flex-direction: column;
            gap: 3px;
            text-align: center;
            font-size: 11px;
        }
        .file-list.grid-view .file-meta span {
            display: block;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-row">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索文件...">
            <button onclick="performSearch()">搜索</button>
            <button onclick="closeSearch()" style="margin-left: 5px;">取消</button>
        </div>

        <div class="view-toggle">
            <button class="view-btn active" data-view="list" onclick="switchView('list')">列表视图</button>
            <button class="view-btn" data-view="grid" onclick="switchView('grid')">平铺视图</button>
        </div>
    </div>

    <div class="path-nav" id="path-nav">
        <div style="display: flex; align-items: center;">
            <div id="current-path" style="flex: 1;">/</div>
        </div>
        <div class="sort-options">
            <button class="sort-btn" data-sort="name">名称</button>
            <button class="sort-btn active" data-sort="type">类型</button>
            <button class="sort-btn" data-sort="date">日期</button>
        </div>
    </div>
</div>

<ul class="file-list" id="file-list"></ul>
<div class="loading" id="loading">加载中...</div>
<div class="search-results" id="search-results" style="display: none;">
    <h3 style="margin: 15px 15px 5px;">搜索结果</h3>
    <ul class="file-list" id="search-results-list"></ul>
    <div class="empty-state" id="search-empty-state" style="display: none; padding: 20px; text-align: center;">
        <p>没有找到匹配的结果</p>
    </div>
</div>

<!-- 视频播放容器 -->
<div id="video-container">
    <div class="player-header">
        <button class="close-btn" id="close-player">← 返回</button>
        <div class="player-title" id="player-title"></div>
    </div>
    <video id="video-player" controls></video>
</div>

<script>
    const API_BASE_URL = `${window.location.protocol}//${window.location.hostname}:${window.location.port || 5000}`;
    let currentPath = "";
    let currentSort = "type";
    let currentOrder = "asc";
    let historyStack = [];
    let currentView = "list"; // 'list' 或 'grid'

    // 切换视图
    function switchView(view) {
        currentView = view;
        const fileList = document.getElementById('file-list');

        // 更新按钮状态
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === view);
        });

        // 更新文件列表类
        fileList.classList.toggle('grid-view', view === 'grid');

        // 重新加载文件
        loadFiles(currentPath);
    }

    function showLoading() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('file-list').innerHTML = '';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    function loadFiles(path = "") {
        showLoading();
        currentPath = path;
        historyStack.push(path);
        let encodedPath = encodeURIComponent(path);
        fetch(`${API_BASE_URL}/files/${encodedPath}?sort=${currentSort}&order=${currentOrder}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('file-list');
                list.innerHTML = '';
                list.className = currentView === 'grid' ? 'file-list grid-view' : 'file-list';

                // 更新路径导航
                const pathNav = document.getElementById('path-nav');
                pathNav.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        ${data.parent !== null ?
                            `<div class="back-btn" onclick="goBack()">← 返回上级</div>` :
                            ''}
                        <div id="current-path" style="flex: 1;">${data.path || "/"}</div>
                    </div>
                    <div class="sort-options">
                        <button class="sort-btn ${currentSort === 'name' ? 'active' : ''}" data-sort="name">名称</button>
                        <button class="sort-btn ${currentSort === 'type' ? 'active' : ''}" data-sort="type">类型</button>
                        <button class="sort-btn ${currentSort === 'date' ? 'active' : ''}" data-sort="date">日期</button>
                    </div>
                `;

                // 添加文件和文件夹
                data.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'file-item';

                    let icon = '📄';
                    let iconClass = 'other-icon';
                    if (item.is_dir) {
                        icon = '📁';
                        iconClass = 'folder-icon';
                    } else if (item.is_video) {
                        icon = '🎬';
                        iconClass = 'video-icon';
                    } else if (item.is_image) {
                        icon = '🖼️';
                        iconClass = 'image-icon';
                    }

                    let thumbnail = '';
                    if (item.has_thumbnail) {
                        thumbnail = `<img src="${API_BASE_URL}${item.thumbnail}" class="thumbnail" onerror="this.style.display='none'">`;
                    } else if (item.is_video || item.is_image) {
                        thumbnail = `<div class="thumbnail"><span class="file-icon ${iconClass}">${icon}</span></div>`;
                    } else if (!item.is_dir) {
                        thumbnail = `<div class="thumbnail"><span class="file-icon ${iconClass}">${icon}</span></div>`;
                    }

                    // 根据视图模式生成不同的HTML结构
                    if (currentView === 'grid') {
                        li.innerHTML = `
                            ${thumbnail}
                            <div class="file-info">
                                <div class="file-name">${item.name}</div>
                                <div class="file-meta">
                                    <span>${item.date}</span>
                                    <span>${item.is_dir ? '' : formatFileSize(item.size)}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        li.innerHTML = `
                            ${thumbnail}
                            <span class="file-icon ${iconClass}">${icon}</span>
                            <div class="file-info">
                                <div class="file-name">${item.name}</div>
                                <div class="file-meta">
                                    <span>${item.date}</span>
                                    <span>${item.is_dir ? '' : formatFileSize(item.size)}</span>
                                </div>
                            </div>
                        `;
                    }

                    li.onclick = () => {
                        if (item.is_dir) {
                            loadFiles(item.path);
                        } else if (item.is_video) {
                            playVideo(item.path, item.name);
                        } else if (item.is_image) {
                            window.open(`${API_BASE_URL}/stream/${item.path}`, '_blank');
                        }
                    };

                    list.appendChild(li);
                });

                hideLoading();
            })
            .catch(error => {
                console.error('Error:', error);
                hideLoading();
            });
    }

    function playVideo(path, name) {
        const container = document.getElementById('video-container');
        const player = document.getElementById('video-player');
        const title = document.getElementById('player-title');

        title.textContent = name;
        let encodedPath = encodeURIComponent(path);

        player.src = `${API_BASE_URL}/stream/${encodedPath}`;
        container.style.display = 'block';
        player.play().catch(e => console.log('自动播放被阻止:', e));
    }

    function closeVideoPlayer() {
        const container = document.getElementById('video-container');
        const player = document.getElementById('video-player');

        player.pause();
        player.src = '';
        container.style.display = 'none';
    }

    function goBack() {
        if (historyStack.length > 1) {
            historyStack.pop(); // 移除当前路径
            const prevPath = historyStack.pop(); // 获取上一级路径
            loadFiles(prevPath);
        } else {
            loadFiles(''); // 返回根目录
        }
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // 执行搜索
    function performSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;

        showLoading();
        fetch(`${API_BASE_URL}/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                const resultsList = document.getElementById('search-results-list');
                const searchResults = document.getElementById('search-results');
                const fileList = document.getElementById('file-list');

                fileList.style.display = 'none';
                searchResults.style.display = 'block';
                resultsList.innerHTML = '';
                resultsList.className = 'file-list'; // 搜索结果使用列表视图

                if (data.results.length === 0) {
                    document.getElementById('search-empty-state').style.display = 'block';
                } else {
                    document.getElementById('search-empty-state').style.display = 'none';

                    data.results.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'file-item';

                        let icon = '📄';
                        let iconClass = 'other-icon';
                        if (item.is_dir) {
                            icon = '📁';
                            iconClass = 'folder-icon';
                        } else if (item.is_video) {
                            icon = '🎬';
                            iconClass = 'video-icon';
                        } else if (item.is_image) {
                            icon = '🖼️';
                            iconClass = 'image-icon';
                        }

                        let thumbnail = '';
                        if (item.has_thumbnail) {
                            thumbnail = `<img src="${API_BASE_URL}${item.thumbnail}" class="thumbnail" onerror="this.style.display='none'">`;
                        } else if (item.is_video || item.is_image) {
                            thumbnail = '<div class="thumbnail"></div>';
                        }

                        li.innerHTML = `
                            ${thumbnail}
                            <span class="file-icon ${iconClass}">${icon}</span>
                            <div class="file-info">
                                <div class="file-name">${item.name}</div>
                                <div class="file-meta">
                                    <span>${item.date}</span>
                                    <span>${item.parent || '/'}</span>
                                </div>
                            </div>
                        `;

                        li.onclick = () => {
                            if (item.is_dir) {
                                loadFiles(item.path);
                                searchResults.style.display = 'none';
                                fileList.style.display = 'block';
                            } else if (item.is_video) {
                                playVideo(item.path, item.name);
                            } else if (item.is_image) {
                                window.open(`${API_BASE_URL}/stream/${item.path}`, '_blank');
                            }
                        };

                        resultsList.appendChild(li);
                    });
                }
                hideLoading();
            })
            .catch(error => {
                console.error('Error:', error);
                hideLoading();
            });
    }

    // 关闭搜索结果
    function closeSearch() {
        document.getElementById('search-results').style.display = 'none';
        document.getElementById('file-list').style.display = 'block';
        document.getElementById('search-input').value = '';
    }

    // 初始化事件监听
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('sort-btn')) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const sort = e.target.dataset.sort;
            if (currentSort === sort) {
                currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = sort;
                currentOrder = sort === 'date' ? 'desc' : 'asc';
            }

            loadFiles(currentPath);
        }

        if (e.target.id === 'close-player') {
            closeVideoPlayer();
        }
    });

    // 监听回车键搜索
    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });

    // 初始化加载根目录
    loadFiles();
</script>
</body>
</html>
